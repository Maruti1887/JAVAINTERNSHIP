<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let c={
            place:"hello"
        }
        let b={
            name:"abc"
        }
        b.__proto__=c;
        let a={
            id:1,
            demo:function(){
                console.log("hello");
            }
        }
        a.__proto__=b;
        console.log(c.place);
        console.log(b.name);
        console.log(b.place);
        console.log(a.id);
        console.log(a.name);
        console.log(a.place);
        
        
    </script>
</body>
</html>
