<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            background-color: deeppink;
        }
        body>h1{
            text-align: center;
            text-decoration: 5px solid blue underline;
            text-shadow: 5px 5px 5px greenyellow;
        }
        body>div:nth-child(3){
           height: 900px;
        display: grid;
        background-color: aquamarine;
            grid-template-columns: 30% 30% 30%;
           grid-template-rows: 50px 75px;
            row-gap: 5px;
            grid-template-areas: "hdr1 hdr1 hdr1"
                                " hdr2 hdr2 hdr2"
                                " sec1 sec1 asd1"
                                " sec2 sec3 sec4 "
                                " sec5 asd2 asd2"
                                "ftr ftr ftr "
                                ;
            
        }
        body>div:nth-child(3)>div{
            border: 1px solid black;
            background-color: rgb(215, 215, 223);
        }

        body>div:nth-child(3)>div:nth-child(1){
            background-color: gray;
            grid-area: hdr1;


        }
        body>div:nth-child(3)>div:nth-child(2){
            background-color: rgb(212, 223, 216);
            grid-area: hdr2;
        }
        body>div:nth-child(3)>div:nth-child(3){
            background-color: rgb(234, 243, 237);
            grid-area: sec1;
        }
        body>div:nth-child(3)>div:nth-child(4){
            background-color: rgb(234, 243, 237);
            grid-area: asd1;
        }
        body>div:nth-child(3)>div:nth-child(5){
            background-color: rgb(234, 243, 237);
            grid-area: sec2;
        }
        body>div:nth-child(3)>div:nth-child(6){
            background-color: rgb(234, 243, 237);
            grid-area: sec3;
        }
        body>div:nth-child(3)>div:nth-child(7){
            background-color: rgb(234, 243, 237);
            grid-area: sec4;
        }
        body>div:nth-child(3)>div:nth-child(8){
            background-color: rgb(234, 243, 237);
            grid-area: sec5;
        }
        body>div:nth-child(3)>div:nth-child(9){
            background-color: rgb(234, 243, 237);
            grid-area: asd2;
        }
        body>div:nth-child(3)>div:nth-child(10){
            background-color: rgb(234, 243, 237);
            grid-area: ftr;
        }
        
        



    </style>
</head>
<body>
    <h1>
        GRID ITEMS
    </h1>
    <hr>
    <div>
        <div>items1</div>
        <div>items2</div>
        <div>items3</div>
        <div>items4</div>
        <div>items5</div>
        <div>items6</div>
        <div>items7</div>
        <div>items8</div>
        <div>items9</div>
        <div>items10</div>
    </div>
</body>
</html>
