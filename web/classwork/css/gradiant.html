    <style>
        h1{

        }
        body>div:nth-child(4){
            height: 300px;
            background-image: linear-gradient(to top left, aqua,black,yellow);
        }
        body>div:nth-child(6){
            height: 300px;
            background-image: repeating-linear-gradient(to bottom left, black 0%,black 10%,red 10%, red 20%);        
        }
        body>div:nth-child(8){
            height: 300px;
            background-image: radial-gradient(yellow,black);
        }
         body>div:nth-child(10){
            height: 300px;
            background-image: repeating-radial-gradient(yellow 0%,yellow 2%,black 2%,black 4%);
        }
        body>div:nth-child(12){
            height: 300px;
            background-image: conic-gradient(yellow ,black,blue,red,aqua,brown,green,orange);
        }
        body>div:nth-child(14){
            height: 300px;
            background-image: repeating-conic-gradient( aqua 0%, navy 1%);
        }
    
    </style>
