<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../CSS/signuppage.css">

</head>
<body>
    <form action="">
        <h1>SignUP form</h1>

        <div>
            <label for="user">Username</label>
            <input type="text" placeholder="enter username" id="user">
            <span id="uerror"></span>
        </div>
        <div>
            <label for="pass">Password</label>
            <input type="text" placeholder="enter passerd"  id="pass">
            <span id="perror"></span>
        </div>
        <div>
            <label for="cpass">Confirm Password</label>
            <input type=" text" placeholder="confirm passeord" id="cpass">
            <span id="cperror"></span>

        </div>
        <div>
            <label for="mail">Email</label>
            <input type="text" placeholder="enter mail id" id="mail">
            <span id="merror"></span>
        </div>
        <div>
            <label for="num">Number</label>
            <input type="text" placeholder="enter number" id="num">
            <span id="nerror"></span>
        </div>
        <div>
            <label for="date">DOB</label>
            <input type="date" id="date">
            <span id="derror"></span>
        </div>
        <div>
            <label for="gender">Gender</label>
            <input type="radio" id="gender" name="gender">Male
            <input type="radio" id="gender" name="gender">Female
            <input type="radio" id="gender" name="gender">Others
            <span id="gerror"></span>
        </div>
        <div>
            <button>Signup</button>
            <button>Login</button>
        </div>
        <div>
            Alreday have an account <a href="../HTML/lopinpage.html">Login</a>
        </div>
    </form>
    <script src="../JS/signuppage.js"></script>
</body>
</html>
