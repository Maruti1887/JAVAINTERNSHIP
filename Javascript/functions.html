<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>


        //IMMEDIATE INVOKING FUNCTION EXPRESSION
        (function(a,b){
            console.log(a+b)
            console.log("hello");
            
        })(10,20),(40,20);
        (function(){
            console.log("welcome to function");
        })()

        // //FUNCTION WITH EXPRESSION
        // let d=input("enter the numbrer");
        let a=function(a,b){

            console.log(a+b);
            
            console.log("hello");
        }
        a(100,200);

        //callback fuction
        function add(mul,sub){
            mul(10);
            sub(20);
        }
        function new1(d){
            return d*d;
        }
        function new2(f){
            return f*f;
        }
        add(new1,new2);

        //named function
        function add1(a,b){
            console.log(a+b);
            
        }
        add1(100,200);

        //arrow function
        let add2=(a,b)=>{
            console.log(a+b);
        }
        add2(30,40)

        let add5=a=> console.log(a);
        add5(10)
        


    </script>
</body>
</html>
