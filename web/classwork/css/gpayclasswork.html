<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        nav{
            height: 50px;
            width: 100%;
            background-color: black;
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        *{
            margin: 0;
        }
        nav>div:nth-child(1)>input{
            padding: 7px 90px;
            height: 30px;
            width: 200px;
            border-radius: 20px;
        }
        ::placeholder{
            color: rgb(0, 0, 0);
        }
        nav>div:nth-child(1)>i{
            color: rgb(0, 0, 0);
            position: absolute;
            top: 20px;
            left: 250px;


        }
        nav>div:nth-child(2)>img{
            height: 30px;
            width: 30px;
            border-radius: 50%;
        }
        main{
            height: 400px;
            width: 100%;
            background-image: url("https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRU8v_AigSZ7McghjcEOw158m3AbKlK0lAMiw&s");
            background-repeat: no-repeat;
            background-size: cover;
            position: relative;
        }
        main>div:nth-child(1)>p{
            color: black;
            position:absolute;
            top: 50px;
            left: 100px;


        }
        main>div:nth-child(2)>p{
            color: black;
            position:absolute;
            top: 80px;
            left: 100px;


        }
        main>div:nth-child(3)>img{
            height: 200px;
            width: 200px;
            border-radius: 50%;
            
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <nav>
        <div>
            <input type="text" placeholder="Pay anyone using UPI">
          <i class="fa-solid fa-magnifying-glass"></i>

        </div>
        <div>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRo61sBSCEYP4aLAFInybbzZcb7qRCY6H5oxw&s" alt="">
        </div>
    </nav>
    <hr>
    <main>
        <div>
            <p>Welcome to google pay </p>
            <p>No one can match this swag</p>
        </div>
        <div>
            <i class="fa-solid fa-arrow-right"></i>
        </div>
        <div>
            <img src="https://thepicturesdp.in/wp-content/uploads/2025/07/Alone-girl-dp-1-1.jpg" alt="">
        </div>
    </main>
</body>
</html>
