<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>

        function getuser(){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    resolve('get user')
                },2000);
            })
        }
        function getorders(order){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    resolve(`${order} is ready`)
                },2000);
            })
        }
        function getpayment(payment){
            return new Promise((resolve,reject)=>{
                setTimeout(()=>{
                    resolve(`${payment} is done`)
                },2000);
            })
        }

        getuser().then((data)=>{
            console.log(data);
            return getorders(data);
        }).then((data)=>{
            console.log(data);
            return getpayment(data);
        }).then((data)=>{
            console.log(data);
        }).catch((err)=>{
            console.log(`due to the network ${err}`);
        })
    </script>
</body>
</html>
